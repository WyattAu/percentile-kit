[package]
name = "percentile-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Latency percentile tracking and budget gates for Rust — P50/P99/P99.9 from criterion output, committed budgets, CI regression enforcement"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/percentile-kit"
keywords = ["latency", "percentile", "benchmark", "criterion", "performance"]
categories = ["development-tools::profiling"]
exclude = [".github/", "benches/"]

[features]
default = ["tracker", "report"]
tracker = []
report = ["dep:serde", "dep:serde_json", "dep:toml", "dep:thiserror"]
loom = ["dep:loom"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
toml = { version = "1.1", optional = true }
loom = { version = "0.7", optional = true }

[dev-dependencies]
criterion = "0.7"
proptest = "1"
tempfile = "3"

[[bench]]
name = "percentile_bench"
harness = false
required-features = ["tracker", "report"]

[[test]]
name = "loom"
required-features = ["loom"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
